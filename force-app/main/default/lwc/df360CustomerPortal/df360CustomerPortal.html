<template>
    <lightning-card title="Customer Experience Hub" icon-name="standard:service_crew">
        <div class="slds-p-around_medium portal-box">
            <template if:true={job}>
                <div class="slds-text-align_center slds-m-bottom_large">
                    <h2 class="slds-text-heading_medium">Service Job #{job.Name}</h2>
                    <span class="slds-badge slds-theme_success slds-m-top_x-small">{job.Status__c}</span>
                </div>
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <p><strong>Assigned Technician:</strong> {technicianName}</p>
                    <p><strong>Equipment:</strong> {assetName}</p>
                </div>
                <div class="rating-box slds-text-align_center">
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">Rate Your Service Experience</h3>
                    <lightning-button-group>
                        <lightning-button label="★ 1" onclick={handleRate} data-val="1"></lightning-button>
                        <lightning-button label="★ 2" onclick={handleRate} data-val="2"></lightning-button>
                        <lightning-button label="★ 3" onclick={handleRate} data-val="3"></lightning-button>
                        <lightning-button label="★ 4" onclick={handleRate} data-val="4"></lightning-button>
                        <lightning-button label="★ 5" variant="brand" onclick={handleRate} data-val="5"></lightning-button>
                    </lightning-button-group>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
