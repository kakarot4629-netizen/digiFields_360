<template>
    <lightning-card title="Customer Satisfaction Scorecard" icon-name="standard:feedback">
        <div class="slds-p-around_medium">
            <div class="slds-text-align_center slds-m-bottom_medium">
                <div class="csat-rating">★ {csatData.avg}</div>
                <p class="slds-text-color_weak">Average CSAT Rating</p>
            </div>
            <div class="csat-list">
                <template for:each={csatData.records} for:item="r">
                    <div key={r.date} class="slds-box slds-m-bottom_x-small slds-theme_shade">
                        <div class="slds-grid slds-grid_align-spread">
                            <span>★ {r.rating} / 5</span>
                            <span class="slds-text-color_weak">{r.jobName} ({r.jobType})</span>
                        </div>
                        <p class="slds-m-top_x-small">{r.comment}</p>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
