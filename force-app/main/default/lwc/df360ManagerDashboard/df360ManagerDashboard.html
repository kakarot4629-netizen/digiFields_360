<template>
    <lightning-card title="digiField360 — Operational Control Dashboard" icon-name="standard:dashboard">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-m-bottom_large">
                <div class="slds-col slds-size_1-of-4">
                    <div class="kpi-card slds-box slds-text-align_center kpi-blue">
                        <div class="kpi-title">Today's Jobs</div>
                        <div class="kpi-value">{metrics.jobsToday}</div>
                        <div class="kpi-subtitle">{metrics.completed} Completed</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="kpi-card slds-box slds-text-align_center kpi-green">
                        <div class="kpi-title">First Time Fix Rate</div>
                        <div class="kpi-value">{metrics.ftfrPct}%</div>
                        <div class="kpi-subtitle">{metrics.ftfr} of {metrics.completed} Fixed</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="kpi-card slds-box slds-text-align_center kpi-purple">
                        <div class="kpi-title">Average CSAT (30d)</div>
                        <div class="kpi-value">★ {metrics.csatAvg}</div>
                        <div class="kpi-subtitle">Target: ★ 4.50+</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="kpi-card slds-box slds-text-align_center kpi-amber">
                        <div class="kpi-title">Pending Parts Approvals</div>
                        <div class="kpi-value">{metrics.partsPending}</div>
                        <div class="kpi-subtitle">Require Review</div>
                    </div>
                </div>
            </div>

            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-box slds-theme_default">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">SLA Health RAG Breakdown</h3>
                        <div class="sla-breakdown slds-m-top_medium">
                            <div class="sla-bar-container">
                                <div class="sla-segment sla-green-bg" style={greenWidth}>Green ({metrics.slaGreen})</div>
                                <div class="sla-segment sla-amber-bg" style={amberWidth}>Amber ({metrics.slaAmber})</div>
                                <div class="sla-segment sla-red-bg" style={redWidth}>Red ({metrics.slaRed})</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_6-of-12">
                    <div class="slds-box slds-theme_default">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">SLA Compliance Rate (30 Days)</h3>
                        <div class="slds-text-align_center slds-p-around_medium">
                            <div class="compliance-pct">{slaReport.compliance}%</div>
                            <p class="slds-text-color_weak">{slaReport.breached} Breaches out of {slaReport.total} Closed Jobs</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
