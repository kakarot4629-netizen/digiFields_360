<template>
    <lightning-card title="Field Attendance & Shift" icon-name="standard:timesheet_entry">
        <div class="slds-p-around_medium slds-text-align_center attendance-box">
            <template if:true={todayRecord}>
                <p class="slds-m-bottom_small">Status: <strong>{todayRecord.Status__c}</strong></p>
                <p class="slds-text-body_small">Checked In: {todayRecord.Check_In_Time__c}</p>
                <template if:true={todayRecord.Check_Out_Time__c}>
                    <p class="slds-text-body_small">Checked Out: {todayRecord.Check_Out_Time__c}</p>
                    <p class="slds-text-body_small">Hours: {todayRecord.Hours_Worked__c}h</p>
                </template>
            </template>
            <div class="slds-m-top_medium">
                <lightning-button variant="brand" label="Check In" icon-name="utility:clock" onclick={handlePunchIn} class="slds-m-right_x-small"></lightning-button>
                <lightning-button variant="destructive" label="Check Out" icon-name="utility:stop" onclick={handlePunchOut}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
