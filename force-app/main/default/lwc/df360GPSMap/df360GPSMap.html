<template>
    <lightning-card title="Live Field GPS Radar" icon-name="standard:address">
        <div class="slds-p-around_medium gps-container">
            <div class="slds-grid slds-gutters">
                <template for:each={techs} for:item="t">
                    <div key={t.id} class="slds-col slds-size_1-of-3 slds-m-bottom_small">
                        <div class="slds-box slds-theme_shade tech-radar-card">
                            <strong>{t.name}</strong>
                            <p class="slds-text-color_weak">Status: {t.status}</p>
                            <p class="slds-text-body_small">Lat: {t.lat}, Lng: {t.lng}</p>
                            <p class="slds-text-body_small">Active Jobs: {t.activeJobs}</p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
