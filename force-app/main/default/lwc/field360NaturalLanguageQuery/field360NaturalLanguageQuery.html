<template>
    <div class="ai-query-container slds-card">
        <!-- Hero Header -->
        <div class="hero-header slds-p-around_medium">
            <div class="header-content slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <div class="ai-glow-avatar">
                            <lightning-icon icon-name="utility:einstein" size="medium" variant="inverse" class="ai-icon"></lightning-icon>
                        </div>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="ai-title">digiField360 Dynamic AI Query Hub</h1>
                        <p class="ai-subtitle">Ask questions in plain English to dynamically search Accounts, Technicians, Work Orders, and Alerts.</p>
                    </div>
                </div>
                <template if:true={hasData}>
                    <div class="record-badge">
                        <lightning-badge label={recordCountBadgeLabel} class="custom-badge"></lightning-badge>
                    </div>
                </template>
            </div>

            <!-- Search Bar -->
            <div class="search-box-wrapper slds-m-top_medium">
                <div class="search-input-container">
                    <lightning-icon icon-name="utility:search" size="small" class="search-icon-prefix"></lightning-icon>
                    <input 
                        type="text" 
                        class="custom-search-input" 
                        placeholder="e.g. 'Top accounts in Pune', 'Who are available resources', 'Show critical open alerts'..."
                        value={searchPrompt} 
                        oninput={handleInputChange} 
                        onkeydown={handleKeyDown} 
                    />
                    <button class="ai-search-button" onclick={handleSearch} disabled={isLoading}>
                        <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Searching" size="small" variant="brand"></lightning-spinner>
                        </template>
                        <template if:false={isLoading}>
                            <lightning-icon icon-name="utility:sparkles" size="x-small" variant="inverse" class="slds-m-right_xx-small"></lightning-icon>
                            <span>Ask AI</span>
                        </template>
                    </button>
                </div>
            </div>

            <!-- Quick Prompt Pills -->
            <div class="quick-pills-container slds-m-top_small">
                <span class="quick-pill-label">⚡ Quick Prompts:</span>
                <template for:each={quickPrompts} for:item="pill">
                    <button 
                        key={pill.text} 
                        class="quick-pill-button" 
                        onclick={handleQuickPillClick} 
                        data-prompt={pill.text}
                    >
                        <span class="pill-icon">{pill.icon}</span>
                        <span>{pill.label}</span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Body Section -->
        <div class="content-body slds-p-around_medium">
            <!-- Loading Skeleton -->
            <template if:true={isLoading}>
                <div class="loading-container slds-p-vertical_large slds-text-align_center">
                    <div class="pulsing-brain">
                        <lightning-icon icon-name="utility:einstein" size="large" class="glow-pulse-icon"></lightning-icon>
                    </div>
                    <p class="ai-thinking-text slds-m-top_small">Analyzing intent, generating SOQL, and fetching real-time records...</p>
                </div>
            </template>

            <!-- Results Display -->
            <template if:false={isLoading}>
                <template if:true={hasSearched}>
                    <!-- Error State -->
                    <template if:true={hasError}>
                        <div class="error-banner slds-p-around_medium slds-m-bottom_medium">
                            <lightning-icon icon-name="utility:error" size="small" variant="error" class="slds-m-right_small"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </template>

                    <!-- Success State -->
                    <template if:false={hasError}>
                        <!-- AI Insights Card -->
                        <div class="ai-insights-card slds-p-around_medium slds-m-bottom_medium">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="insights-icon-circle slds-m-right_small">
                                    <lightning-icon icon-name="utility:light_bulb" size="x-small" variant="warning"></lightning-icon>
                                </div>
                                <div class="insights-text-wrapper slds-grow">
                                    <span class="insights-label">AI Query Insight:</span>
                                    <p class="insights-summary">{aiSummary}</p>
                                </div>
                                <div class="soql-toggle-btn">
                                    <lightning-button 
                                        variant="neutral" 
                                        label={soqlButtonLabel} 
                                        icon-name="utility:code" 
                                        size="small" 
                                        onclick={toggleSoql}
                                    ></lightning-button>
                                </div>
                            </div>

                            <!-- Expandable SOQL Inspector -->
                            <template if:true={showSoql}>
                                <div class="soql-inspector-box slds-m-top_small slds-p-around_small">
                                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                                        <span class="soql-box-title">Generated Dynamic SOQL Query:</span>
                                        <lightning-button-icon 
                                            icon-name="utility:copy" 
                                            size="x-small" 
                                            variant="border-filled" 
                                            alternative-text="Copy SOQL" 
                                            title="Copy SOQL" 
                                            onclick={copySoql}
                                        ></lightning-button-icon>
                                    </div>
                                    <code class="soql-code-text">{generatedSoql}</code>
                                </div>
                            </template>
                        </div>

                        <!-- Records Table -->
                        <template if:true={hasData}>
                            <div class="table-container">
                                <lightning-datatable 
                                    key-field="Id" 
                                    data={data} 
                                    columns={columns} 
                                    hide-checkbox-column 
                                    show-row-number-column 
                                    sorted-by={sortedBy} 
                                    sorted-direction={sortedDirection} 
                                    onsort={handleSort}
                                    class="custom-datatable"
                                >
                                </lightning-datatable>
                            </div>
                        </template>

                        <!-- Empty State -->
                        <template if:false={hasData}>
                            <div class="empty-state-box slds-p-around_large slds-text-align_center">
                                <lightning-icon icon-name="utility:search" size="large" class="empty-icon"></lightning-icon>
                                <h3 class="empty-title slds-m-top_small">No Records Found</h3>
                                <p class="empty-desc">No records matched your search query. Try asking with different keywords or location.</p>
                            </div>
                        </template>
                    </template>
                </template>

                <!-- Initial Empty Helper State -->
                <template if:false={hasSearched}>
                    <div class="initial-helper-card slds-p-around_large slds-text-align_center">
                        <div class="helper-icon-wrapper">
                            <lightning-icon icon-name="utility:chat" size="large" class="helper-icon"></lightning-icon>
                        </div>
                        <h2 class="helper-title slds-m-top_small">What would you like to find today?</h2>
                        <p class="helper-desc">Type any question above or click one of the quick prompts to query Salesforce in real-time.</p>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
