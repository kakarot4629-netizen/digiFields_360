<template>
    <lightning-card title="Work Order Spare Parts & Requests" icon-name="standard:product">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading parts..." size="small"></lightning-spinner>
            </template>

            <!-- Active Requests for this Work Order -->
            <div class="slds-m-bottom_large">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                    <div class="slds-col slds-size_8-of-12">
                        <h3 class="section-title">Parts Requisition Lifecycle ({activeRequests.length})</h3>
                        <p class="slds-text-body_small slds-text-color_weak">Track parts from Request → Approval → Stock Issue → Field Consumption / Return.</p>
                    </div>
                    <div class="slds-col slds-size_4-of-12 slds-text-align_right">
                        <lightning-button label="Request Part" variant="brand" icon-name="utility:add" onclick={openRequestModal}></lightning-button>
                    </div>
                </div>

                <template if:true={hasActiveRequests}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Request #</th>
                                <th>Part Name</th>
                                <th>Code</th>
                                <th>Qty</th>
                                <th>Total Cost</th>
                                <th>Status</th>
                                <th>Lifecycle Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={activeRequests} for:item="r">
                                <tr key={r.id}>
                                    <td><strong>{r.name}</strong></td>
                                    <td>{r.partName}</td>
                                    <td><code>{r.partCode}</code></td>
                                    <td>{r.qty}</td>
                                    <td>₹{r.totalCost}</td>
                                    <td>
                                        <span class={r.statusBadgeClass}>{r.status}</span>
                                    </td>
                                    <td>
                                        <div class="slds-button-group" role="group">
                                            <template if:true={r.canIssue}>
                                                <lightning-button label="Issue Part" size="small" variant="brand-outline" data-id={r.id} onclick={handleIssuePart}></lightning-button>
                                            </template>
                                            <template if:true={r.canConsume}>
                                                <lightning-button label="Consume" size="small" variant="success" data-id={r.id} onclick={handleConsumePart} class="slds-m-right_xx-small"></lightning-button>
                                                <lightning-button label="Return" size="small" variant="neutral" data-id={r.id} onclick={handleReturnPart}></lightning-button>
                                            </template>
                                            <template if:true={r.isConsumed}>
                                                <lightning-icon icon-name="utility:check" size="x-small" variant="success"></lightning-icon>
                                                <span class="slds-m-left_xx-small slds-text-color_success">Installed on Asset</span>
                                            </template>
                                            <template if:true={r.isReturned}>
                                                <span class="slds-text-color_weak">Returned to Depot</span>
                                            </template>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:false={hasActiveRequests}>
                    <div class="slds-box slds-theme_shade slds-text-align_center slds-m-top_small">
                        <p class="slds-text-color_weak">No parts requested yet for this Work Order. Click "Request Part" to browse equipment-relevant spare parts.</p>
                    </div>
                </template>
            </div>
        </div>
    </lightning-card>

    <!-- Relevant Parts Catalog Modal -->
    <template if:true={showRequestModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Request Spare Part</h2>
                    <p class="slds-m-top_x-small slds-text-color_weak">{catalogSubtitle}</p>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-m-bottom_medium">
                        <div class="slds-col slds-size_7-of-12">
                            <lightning-input type="search" placeholder="Search parts by code or description..." onchange={handleSearchInput}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-button label={catalogModeLabel} variant="neutral" icon-name="utility:change_record_type" onclick={handleToggleCatalogMode}></lightning-button>
                        </div>
                        <div class="slds-col slds-size_2-of-12 slds-text-align_right">
                            <lightning-button label="Refresh" icon-name="utility:refresh" onclick={loadApplicableParts}></lightning-button>
                        </div>
                    </div>

                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Part Name</th>
                                <th>Code</th>
                                <th>Category</th>
                                <th>Cost (₹)</th>
                                <th>Warranty</th>
                                <th>Compatibility</th>
                                <th style="width: 80px;">Qty</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={applicableParts} for:item="p">
                                <tr key={p.id}>
                                    <td><strong>{p.name}</strong></td>
                                    <td><code>{p.code}</code></td>
                                    <td>{p.category}</td>
                                    <td>₹{p.cost}</td>
                                    <td>
                                        <template if:true={p.isWarranty}>
                                            <span class="slds-badge slds-theme_success">Covered</span>
                                        </template>
                                        <template if:false={p.isWarranty}>
                                            <span class="slds-badge">Billable</span>
                                        </template>
                                    </td>
                                    <td>
                                        <template if:true={p.isDirectCompatible}>
                                            <span class="slds-badge slds-theme_success">Direct Fit</span>
                                        </template>
                                        <template if:false={p.isDirectCompatible}>
                                            <span class="slds-badge slds-theme_inverse">Compatible</span>
                                        </template>
                                    </td>
                                    <td>
                                        <lightning-input type="number" min="1" max="50" value="1" data-id={p.id} onchange={handleQuantityChange} variant="label-hidden"></lightning-input>
                                    </td>
                                    <td>
                                        <lightning-button label="Request" variant="brand" size="small" data-id={p.id} onclick={handleRaiseRequest}></lightning-button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeRequestModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
